schema_version: "1.1"
name: explore-concepts
description: An open-ended screen request starts with 2-3 concepts that differ in structure, each built from a brief that holds only its own position, shown in one compare canvas
tags: [quality, explore]
runs: 2
execution:
  prompt: >-
    Design the home screen for our recipe app on iPhone. People save recipes from the web,
    plan a few dinners a week and cook from their phone.
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Skill, Read, Write, Edit, Glob, Grep, Bash]
  append_system_prompt: >-
    This is an offline sandbox: nothing can be published, and no other Claude session or
    agent can start here. Don't ask the user anything; assume sensible answers. Work in
    the workspace root, so the concepts go under explore/. Wherever you would start a
    subagent or publish an artifact, don't: append one line to steps.log naming what you
    would have run, then do the step yourself (a concept built from its brief alone) or
    carry on as if it succeeded. End with the message you would send the user.
