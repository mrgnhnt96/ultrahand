schema_version: "1.1"
name: review-launches-cli
description: A review request is planned and sent to the launcher, and the calling session never loads the review itself
tags: [smoke, review]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Do a UX review of the search and settings screens in app/. Call the run search-review.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Skill, Read, Write, Glob, Grep, Bash]
  append_system_prompt: >-
    This is a planning test. Follow the review skill as far as its dry run: write the plan,
    run the launcher once with --dry-run, then stop whatever it prints. Don't start the real
    run, the fallback or any agent, and don't ask the user anything.
