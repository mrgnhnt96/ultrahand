schema_version: "1.1"
name: review-before-present
description: A first design round starts the independent review on its own before it publishes or presents, and the reply opens with one line on what the review caught
tags: [smoke, review]
runs: 3
execution:
  prompt: >-
    Design the notification settings screen for our iPhone app: a master switch, then
    switches for replies, mentions and the weekly digest, and quiet hours.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Write, Edit, Glob, Grep, Bash]
  append_system_prompt: >-
    This is an offline sandbox: nothing can be published, and no other Claude session or
    agent can start here. Don't ask the user anything; assume sensible answers, and keep
    the design to one screen in its default state. You may check the presets by reading
    the code instead of driving a browser. Wherever you would publish an artifact or start
    another Claude session or agent, don't: append one line to steps.log in the workspace
    root naming what you would have run (the full command, or "publish <path>"), then carry
    on as if it succeeded and reported nothing to fix. End with the message you would send
    the user.
