schema_version: "1.1"
name: screens-per-page
description: A whole-app redesign is split into pages of about a dozen screens, with variants as states, so Go to stays reviewable
tags: [quality, desktop]
runs: 2
execution:
  prompt: >-
    Redesign our whole task board desktop app. It has an inbox of things that need me, a
    task view (tasks can be working, stopped, failed, merged or waiting on my review), goals
    split into waves with notes and attachments, a backlog where I can select several items
    and plan them into waves, an ideas list, a weekly view with daily recaps, releases per
    project, and settings with accounts, sign-in, usage, work hours, reviewers and
    worktrees tabs.
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [Skill, Read, Write, Edit, Glob, Grep, Bash]
  append_system_prompt: >-
    This is an offline sandbox: nothing can be published, and no other Claude session or
    agent can start here. Don't ask the user anything; assume sensible answers. If you
    would show a blueprint or concepts first, assume the owner approved the first one
    unchanged and carry on to the full design. Save every finished canvas page under
    design/ in the workspace. Wherever you would publish an artifact or start a review,
    don't: append one line to steps.log naming what you would have run, then carry on as
    if it succeeded and reported nothing to fix. End with the message you would send the
    user.
