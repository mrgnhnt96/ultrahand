schema_version: "1.1"
name: lessons-compacted
description: Over-limit design records are compacted by the documented procedure without losing a rule
tags: [quality, lessons]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Our design lessons and theme notes have gotten long. Can you tidy them up?
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Write, Edit, Glob, Grep, Bash]
  append_system_prompt: >-
    The owner has already said yes to whatever compaction you propose: show the table,
    then apply it without waiting for another reply.
