schema_version: "1.1"
name: handoff-build
description: Building an approved design from its handoff carries the spec's anchors into the code and checks each section against the spec before the next, keeping screenshots to one pair for the screen
tags: [quality, handoff]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    The Lists screen design for our Pantry web app is approved and handed off in
    design/pantry/. Build the screen in src/app.js.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Write, Edit, Glob, Grep, Bash]
  append_system_prompt: >-
    This is an offline sandbox: no browser or server can run here, and no other Claude
    session or agent can start. Don't ask the user anything; assume sensible answers.
    Wherever you would check the running app (run a test or check in a browser, take a
    screenshot, or start a review), don't: append one line to steps.log naming what you
    would have run and what it covers (the screen, sections or anchors, preset and
    state), then carry on as if it passed. End with the message you would send the user.
