schema_version: "1.1"
name: blueprint-skipped
description: A correction to a published design changes the design directly, with no blueprint or parts sheet first
tags: [smoke, blueprint]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    On the transactions screen in design/, the day headings are too loud and the amounts
    don't line up. Make the headings quieter and right-align the amounts.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Write, Edit, Glob, Grep, Bash]
  append_system_prompt: >-
    This is an offline sandbox: nothing can be published, and no other Claude session or
    agent can start here. Don't ask the user anything; assume sensible answers. Wherever
    you would publish an artifact or start a review or another agent, don't: append one
    line to steps.log naming what you would have run, then carry on as if it succeeded and
    reported nothing to fix. End with the message you would send the user.
