schema_version: "1.1"
name: handoff-spec
description: An approved design is handed off as an anchored screen, a spec.json and the implementer's brief, and the reply tells the developer to build section by section and check in three tiers
tags: [quality, handoff]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    The phone design for our Pantry app's Lists screen is approved (it's in design/pantry/).
    Our developer starts building it in the app next week. Hand it off to them.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Write, Edit, Glob, Grep, Bash]
  append_system_prompt: >-
    This is an offline sandbox: nothing can be published, no browser can run, and no other
    Claude session or agent can start here. Don't ask the user anything; assume sensible
    answers. Wherever you would measure the built design in a browser, read its CSS
    instead. Wherever you would publish an artifact or start a review or another agent,
    don't: append one line to steps.log naming what you would have run, then carry on as
    if it succeeded and reported nothing to fix. End with the message you would send the
    user.
